name: Solar City
description: >-
  SolarCity was a San Mateo, California based provider of residential and commercial
  solar energy systems, founded in 2006 by brothers Peter and Lyndon Rive with backing
  and board chairmanship from their cousin Elon Musk. The company designed, financed,
  installed, and monitored rooftop solar and energy-storage systems, and became the
  largest residential solar installer in the United States before its 2012 IPO
  (NASDAQ: SCTY). In November 2016 SolarCity was acquired by Tesla, Inc. in an
  all-stock deal valued at roughly 2.6 billion US dollars and was absorbed into
  Tesla's energy-generation and storage business; the SolarCity brand was
  subsequently retired and its products relaunched under Tesla (Solar Roof, Solar
  Panels, Powerwall). SolarCity no longer operates as an independent company and
  publishes no standalone developer portal, public API, or OpenAPI surface. The
  solarcity.com domain remains registered under Tesla's DNS infrastructure but no
  longer serves a live website.
